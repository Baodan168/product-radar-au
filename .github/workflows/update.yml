name: Deploy Product Radar

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时刻只允许一个部署：连续两次 push 时排队而不是互踩
# （上一个部署未结束时，deploy-pages 会直接报 deployment in progress）。
concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # 数据里的时间戳（scan_date、扫描时间）都是北京时间，runner 默认 UTC，
      # 差 8 小时。「数据新鲜度」卡拿 now 减这些时间戳，不设时区会永远显示「刚刚」，
      # 而那张卡的用处恰恰是「扫描断了要一眼看出来」。
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # festival_engine 用了 PEP 701 的嵌套 f-string

      # 产物出库（对齐 UK 的 PROPOSAL-artifacts-out-of-git.md，2026-08-29 落地）：
      # index.html / platform.html / output/data/*.js 由 CI 从 data/ 里的扫描数据
      # 现场生成，main 只存代码和数据，本机 cron 只推 data/。
      # 生成链路全程标准库（与 UK 同源的生成器），无需装依赖。
      - name: Generate artifacts in CI
        run: |
          python3 generate_platform.py
          python3 generate_portal.py

      - uses: actions/configure-pages@v5

      # 补货页由仓库外的项目生成，会带毛利率/销量等敏感字段。
      # 在拷进 deploy/ 之前拦一道：有人直接提交了未脱敏的文件，
      # 这里会红，而不是静默上线。修法是本地跑
      # `python3 desensitize_analysis.py` 后重新提交。
      - name: Check restock pages are desensitized
        run: python3 desensitize_analysis.py --check

      - name: Prepare deployment
        run: |
          # Create deploy directory
          mkdir -p deploy/data/channels

          # Copy output files（index/platform/data/assets 为上一步 CI 现场生成，
          # analysis/ 为补货管道入库的静态页）
          cp -r output/* deploy/

          # Copy shared design system
          if [ -d shared ]; then
            cp -r shared deploy/shared
          fi

          # Copy portal assets (JS/CSS extracted out of the generators).
          # Source of truth is assets/ at repo root; output/assets/ is only a
          # local build mirror produced by generate_portal.sync_assets().
          if [ -d assets ]; then
            mkdir -p deploy/assets
            cp -r assets/* deploy/assets/
          fi

          # Copy data files for date picker
          # data/channels/ 在 .gitignore 里（扫描数据只走 API 增量推送，不入 git），
          # 但仓库树里存在（API 推送绕过 gitignore）。有则拷，无则跳过。
          cp data/channels/*.json deploy/data/channels/ 2>/dev/null || echo "  ℹ️ data/channels/ 不在树中，跳过"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - id: deployment
        uses: actions/deploy-pages@v4
